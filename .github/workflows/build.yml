name: Windows x64 Native AOT

on:
    push:
        branches: ['**']
        tags: ['v*']
    pull_request:
    workflow_dispatch:
        inputs:
            test_native_media:
                description: Run optional Media Foundation decoder validation (requires installed Windows codecs)
                type: boolean
                default: false

permissions:
    contents: read

defaults:
    run:
        shell: pwsh

jobs:
    native-aot:
        runs-on: windows-latest
        timeout-minutes: 30
        env:
            IRX_STORAGE_STRICT_LENGTH: '1'
            IRX_TRACE_COLOR_FLOW: '0'
            IRX_R31_INPUT_COLOR_TRACE: '0'
            IRX_INPUT_DUALSENSE: '0'
        steps:
            - uses: actions/checkout@v6
              with:
                  persist-credentials: false
            - uses: actions/setup-dotnet@v5
              with:
                  global-json-file: global.json
            - uses: actions/setup-python@v6
              with:
                  python-version: '3.12'
            - uses: ilammy/msvc-dev-cmd@v1
              with:
                  arch: x64
            - name: Normalize MSBuild platform after MSVC setup
              run: |
                  "Platform=AnyCPU" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
            - name: Restore solution
              run: dotnet restore IraRationis.slnx -p:Configuration=Release -p:Platform="Any CPU"
            - name: Build solution
              run: dotnet build IraRationis.slnx -c Release --no-restore -p:Platform="Any CPU"
            - name: Run component tests
              run: dotnet run --project IraRationis.Runtime.Tests -c Release --no-build
            - name: Run component contract executables
              run: |
                  $projects = @(
                      'tests/startup-evidence/StartupEvidence.Contracts.csproj',
                      'tests/versioned-upload/VersionedUpload.Contracts.csproj',
                      'tests/descriptor-bindings/DescriptorBindings.Contracts.csproj'
                  )

                  foreach ($project in $projects)
                  {
                      Write-Host "Testing $project"

                      dotnet run --project $project -c Release --no-build

                      if ($LASTEXITCODE -ne 0)
                      {
                          throw "Contract failure: $project"
                      }
                  }
            - name: Test strict storage contracts
              run: dotnet run --project tests/storage-contract/StorageContract.csproj -c Release --no-build
            - name: Test runtime media contracts (headless)
              run: dotnet run --project tests/runtime-media/RuntimeMedia.csproj -c Release --no-build
            - name: Build native runtime audio fixture
              run: dotnet msbuild tests/native/runtime-audio/RuntimeAudio.proj -t:Build
            - name: Publish Native AOT executable
              run: dotnet publish IraRationis.Cli/IraRationis.Cli.csproj -c Release -r win-x64 -o artifacts/native
            - name: Test memory page table
              run: ./artifacts/native/irx.exe memory-probe --self-test
            - name: Test native VEH during managed exception dispatch
              run: ./artifacts/native/irx.exe veh-probe
            - name: Test instruction memory validation and page permissions
              run: ./artifacts/native/irx.exe instruction-probe
            - name: Publish authored runtime bridge contracts with Native AOT
              run: dotnet publish IraRationis.Runtime.Tests -c Release -r win-x64 -p:Platform=AnyCPU -o artifacts/runtime-bridge-contracts
            - name: Test native runtime bridge forwarding and diagnostic contracts
              run: ./artifacts/runtime-bridge-contracts/IraRationis.Runtime.Tests.exe --runtime-bridge-only
            - name: Smoke-test native executable
              run: python tests/smoke.py artifacts/native/irx.exe
            - name: Test native entry and thread execution
              run: ./tests/native/smoke.ps1 artifacts/native/irx.exe
            - name: Test GameInput and physical page mapping
              run: ./tests/native/input-memory.ps1 artifacts/native/irx.exe
            - name: Test DirectStorage ABI and completion
              run: ./tests/native/storage.ps1 artifacts/native/irx.exe
            - name: Test native audio ABI and external asset (headless)
              run: |
                  $ErrorActionPreference = 'Stop'
                  $PSNativeCommandUseErrorActionPreference = $false
                  Remove-Item Env:IRX_RUNTIME_PCM_STREAM -ErrorAction SilentlyContinue
                  & ./artifacts/native/irx.exe run ./artifacts/runtime-audio-r41/probe.exe
                  if ($LASTEXITCODE -ne 42) { throw "Unexpected audio fixture exit: $LASTEXITCODE" }
                  exit 0
            - name: Locate or install FFmpeg for synthetic media tests
              run: |
                  $ErrorActionPreference = 'Stop'
                  $ffmpeg = Get-Command ffmpeg.exe -ErrorAction SilentlyContinue
                  if (-not $ffmpeg) {
                      choco install ffmpeg --yes --no-progress
                      if ($LASTEXITCODE -ne 0) { throw 'FFmpeg installation failed.' }
                      $env:Path += ";$env:ChocolateyInstall\bin"
                      $ffmpeg = Get-Command ffmpeg.exe -ErrorAction Stop
                  }
                  "IRX_CI_FFMPEG=$($ffmpeg.Source)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
            - name: Test media primitives and synthetic decoding
              run: |
                  $clip = (Resolve-Path tests/media-baseline/fixture.mp4).Path
                  dotnet run --project tests/media-baseline/MediaBaseline.csproj -c Release --no-build -- $env:IRX_CI_FFMPEG $clip
            - name: Test Native AOT media CLI (noninteractive)
              run: |
                  $clip = (Resolve-Path tests/media-baseline/fixture.mp4).Path
                  & ./artifacts/native/irx.exe media-probe $env:IRX_CI_FFMPEG $clip
            - name: Test in-process Windows media decoder (opt-in)
              if: github.event_name == 'workflow_dispatch' && inputs.test_native_media
              run: |
                  $clip = (Resolve-Path tests/media-baseline/fixture.mp4).Path
                  $output = & ./artifacts/native/irx.exe media-probe --mf $clip
                  $code = $LASTEXITCODE
                  $output | Write-Host
                  if ($code -ne 0) { throw "Media Foundation probe failed: $code" }
                  if (($output -join "`n") -notmatch 'IRX-R37: frames=60; unique=60; audioSamples=\d+; peak=[1-9]\d*; sampleRate=48000; channels=2; backend=MediaFoundation') {
                      throw 'Native decoder did not return expected fixture evidence.'
                  }
            - name: Prepare validated binary distribution
              run: |
                  $ErrorActionPreference = 'Stop'
                  if (!(Test-Path artifacts/native/irx.exe) -or !(Test-Path artifacts/native/irx-native.dll)) {
                      throw 'Required runtime binaries missing.'
                  }
                  $stage = 'artifacts/distribution'
                  New-Item -ItemType Directory -Path $stage -Force | Out-Null
                  Get-ChildItem artifacts/native -Force | Where-Object { $_.Extension -ne '.pdb' } | Copy-Item -Destination $stage -Recurse -Force
                  Copy-Item README.md, LICENSE, LICENSE-PROPRIETARY.md -Destination $stage
                  Copy-Item docs/QUICKSTART.txt -Destination $stage
                  New-Item -ItemType Directory -Path "$stage/media" -Force | Out-Null
                  Copy-Item tests/media-baseline/vindex-intro.mp4 "$stage/media/vindex-intro.mp4"
                  & "$stage/irx.exe" --help
                  if ($LASTEXITCODE -ne 0) { throw 'Packaged executable smoke test failed.' }
                  if (Test-Path docs/assets/crest.png) {
                      New-Item -ItemType Directory -Path "$stage/docs/assets" -Force | Out-Null
                      Copy-Item docs/assets/crest.png "$stage/docs/assets/crest.png"
                  }
                  New-Item -ItemType Directory -Path "$stage/docs" -Force | Out-Null
                  Copy-Item docs/architecture.md, docs/ARCHITECTURE-ATLAS.md, docs/ARCHITECTURAL-DIVERGENCE.md, docs/RUNTIME-INTEGRATION.md, docs/DIAGNOSTICS.md, docs/PROVENANCE.md, docs/QUICKSTART.txt, docs/RELEASING.md -Destination "$stage/docs"
                  New-Item -ItemType Directory -Path "$stage/scripts" -Force | Out-Null
                  Copy-Item scripts/Export-NetworkTrace.ps1 -Destination "$stage/scripts"
                  @("Commit: $env:GITHUB_SHA", "Ref: $env:GITHUB_REF", "Run: $env:GITHUB_RUN_ID", "SDK: $(dotnet --version)") | Set-Content "$stage/BUILD-INFO.txt" -Encoding utf8
                  New-Item -ItemType Directory -Path artifacts/release -Force | Out-Null
                  Compress-Archive -Path "$stage/*" -DestinationPath artifacts/release/irx-win-x64.zip -Force
            - name: Upload validated Windows distribution
              uses: actions/upload-artifact@v4
              with:
                  name: irx-win-x64
                  path: artifacts/release/irx-win-x64.zip
                  if-no-files-found: error
                  retention-days: 14

            - name: Upload unpacked Windows executable and dependencies
              uses: actions/upload-artifact@v4
              with:
                  name: irx-win-x64-unpacked
                  path: artifacts/distribution/
                  if-no-files-found: error
                  retention-days: 14

    draft-release:
        needs: native-aot
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        runs-on: windows-latest
        timeout-minutes: 10
        permissions:
            contents: write
        steps:
            - uses: actions/checkout@v6
              with:
                  persist-credentials: false
            - uses: actions/download-artifact@v4
              with:
                  name: irx-win-x64
                  path: artifacts/release
            - name: Package matching source and checksums
              run: |
                  $ErrorActionPreference = 'Stop'
                  # Archive the exact tagged source, not the runner's generated outputs.
                  git archive --format=zip --output=artifacts/release/irx-source.zip HEAD
                  if ($LASTEXITCODE -ne 0) { throw 'Source archive failed.' }
                  $files = Get-ChildItem artifacts/release -Filter '*.zip' | Sort-Object Name
                  if ($files.Count -ne 2) { throw 'Expected binary and source archives.' }
                  $files | ForEach-Object {
                      $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
                      "$hash  $($_.Name)"
                  } | Set-Content artifacts/release/SHA256SUMS.txt -Encoding ascii
            - name: Create draft prerelease for maintainer review
              env:
                  GH_TOKEN: ${{ github.token }}
                  RELEASE_TAG: ${{ github.ref_name }}
              run: |
                  gh release create $env:RELEASE_TAG artifacts/release/irx-win-x64.zip artifacts/release/irx-source.zip artifacts/release/SHA256SUMS.txt --repo $env:GITHUB_REPOSITORY --verify-tag --draft --prerelease --generate-notes --title "Ira Rationis $env:RELEASE_TAG"
                  if ($LASTEXITCODE -ne 0) { throw 'Draft release creation failed; inspect any existing draft before retrying.' }
                  
    auto-tag:
        name: Tag validated IraRationis revision
        needs: native-aot

        if: github.event_name == 'push' && github.ref == 'refs/heads/main'

        runs-on: ubuntu-latest
        timeout-minutes: 5

        permissions:
            contents: write

        steps:
            - uses: actions/checkout@v6
              with:
                  fetch-depth: 0

            - name: Detect and tag release
              shell: bash
              run: |
                  set -euo pipefail

                  subject=$(git show -s --format=%s "$GITHUB_SHA")
                  pattern='^(R[1-9][0-9]*(\.[0-9]+)*):[[:space:]]'

                  if [[ ! "$subject" =~ $pattern ]]; then
                      echo "Not a release commit. Skipping."

                      exit 0
                  fi

                  tag="${BASH_REMATCH[1]}"

                  if git show-ref --verify --quiet "refs/tags/$tag"; then
                      existing=$(git rev-parse "refs/tags/$tag^{commit}")

                      if [[ "$existing" == "$GITHUB_SHA" ]]; then
                          echo "$tag already exists for this commit."

                          exit 0
                      fi

                      echo "::error::Tag $tag belongs to another commit."

                      exit 1
                  fi

                  git config user.name "github-actions[bot]"
                  git config user.email \
                      "41898282+github-actions[bot]@users.noreply.github.com"

                  git tag -a "$tag" "$GITHUB_SHA" -m "$subject"

                  git push origin "refs/tags/$tag"

                  echo "Successfully created release tag $tag."
